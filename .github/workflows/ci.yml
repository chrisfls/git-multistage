name: CI

on:
  # The workflow runs by hand only: GitHub bills its minutes, and `mise run ci` runs the same checks locally.
  workflow_dispatch:

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          install_args: node npm:@anthropic-ai/claude-code
      # Reads only the plugin files; needs no API key.
      - name: Validate the plugin
        run: claude plugin validate --strict .

  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          install_args: go golangci-lint node npm:@fission-ai/openspec
      - name: Git version
        run: git --version
      - name: Checks
        run: mise run ci
