name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the versions that mise.toml pins.
      - uses: jdx/mise-action@v5
        with:
          install_args: go golangci-lint
      - name: Format
        run: golangci-lint fmt --diff ./...
      - name: Lint
        run: golangci-lint run ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          install_args: go
      - name: Git version
        run: git --version
      - name: Vet
        run: go vet ./... && go vet -tags testhooks ./...
        shell: bash
      - name: Test
        run: go test -count=1 -timeout 30m ./...
      - name: Stress
        env:
          MULTISTAGE_STRESS: "3"
        run: go test -count=1 -timeout 30m -run "Many|Hunks|Native|Kill" ./test/
