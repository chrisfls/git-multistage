name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
          install-only: true
      - name: Format
        run: golangci-lint fmt --diff ./...
      - name: Lint
        run: golangci-lint run ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Git version
        run: git --version
      - name: Vet
        run: go vet ./... && go vet -tags testhooks ./...
        shell: bash
      - name: Test
        run: go test -count=1 -timeout 30m ./...
      - name: Stress
        env:
          MULTISTAGE_STRESS: "3"
        run: go test -count=1 -timeout 30m -run "Many|Hunks|Native|Kill" ./test/
