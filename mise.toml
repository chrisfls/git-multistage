# Tool versions for local work and CI. Run `mise install` to install them.
[tools]
go = "1.27.4"
golangci-lint = "2.15.0"
# The OpenSpec CLI that the openspec-* skills run. Bump it with the ref in rulesync.jsonc.
node = "22"
"npm:@fission-ai/openspec" = "2.0.0"
# The Claude Code CLI that CI runs `claude plugin validate` with.
"npm:@anthropic-ai/claude-code" = "2.1.310"
# act runs the Linux CI jobs in containers, and needs a Docker engine.
act = "0.2.97"

[tasks.release]
description = "Build the release archives from the pushed default branch and publish them: mise run release <version>"
run = "bash scripts/release.sh"

[tasks.ci]
description = "Run the checks of the project: format, lint, vet, tests, and OpenSpec validation"
shell = "bash -c"
env = { OPENSPEC_NO_UPDATE_CHECK = "1" }
run = [
  "golangci-lint fmt --diff ./...",
  "golangci-lint run ./...",
  "go vet ./...",
  "go vet -tags testhooks ./...",
  "go test -count=1 -timeout 30m ./...",
  "openspec validate --all --strict",
]

[tasks."ci:stress"]
description = "Repeat the concurrency and crash tests"
shell = "bash -c"
env = { MULTISTAGE_STRESS = "3" }
run = "go test -count=1 -timeout 30m -run 'Many|Hunks|Native|Kill' ./test/"
